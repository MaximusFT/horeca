name: Sync Vercel environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SILPO_OAUTH_ENCRYPTION_KEY: ${{ secrets.SILPO_OAUTH_ENCRYPTION_KEY }}
      VERCEL_SCOPE: maximusfts-projects
      VERCEL_PROJECT: horeca
    steps:
      - name: Check required secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "$TURSO_DATABASE_URL" || { echo "Missing TURSO_DATABASE_URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing TURSO_AUTH_TOKEN"; exit 1; }
          test -n "$SILPO_OAUTH_ENCRYPTION_KEY" || { echo "Missing SILPO_OAUTH_ENCRYPTION_KEY"; exit 1; }

      - name: Validate Vercel access token
        run: |
          length=${#VERCEL_TOKEN}
          if [ "$length" -lt 20 ]; then
            length_class="too-short"
          elif [ "$length" -le 80 ]; then
            length_class="plausible"
          else
            length_class="too-long"
          fi
          case "$VERCEL_TOKEN" in
            \"*|*\"|'*|*') has_quotes=yes ;;
            *) has_quotes=no ;;
          esac
          if printf '%s' "$VERCEL_TOKEN" | grep -q '[[:space:]]'; then
            has_whitespace=yes
          else
            has_whitespace=no
          fi
          echo "VERCEL_TOKEN format: length=$length_class, quotes=$has_quotes, whitespace=$has_whitespace"
          test "$length_class" = "plausible" || exit 1
          test "$has_quotes" = "no" || exit 1
          test "$has_whitespace" = "no" || exit 1
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)
          test "$status" = "200" || {
            echo "VERCEL_TOKEN was rejected by the Vercel API (HTTP $status). Create an Access Token in Vercel Account Settings → Tokens and replace the GitHub Production environment secret."
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link Vercel project
        run: npx --yes vercel@59.10.0 link --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT"

      - name: Sync Turso secrets to Vercel
        run: |
          sync_secret() {
            name="$1"
            value="$2"
            for target in production preview; do
              printf '%s' "$value" | npx --yes vercel@59.10.0 env add "$name" "$target" --force --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
            done
          }
          sync_secret TURSO_DATABASE_URL "$TURSO_DATABASE_URL"
          sync_secret TURSO_AUTH_TOKEN "$TURSO_AUTH_TOKEN"
          sync_secret SILPO_OAUTH_ENCRYPTION_KEY "$SILPO_OAUTH_ENCRYPTION_KEY"

      - name: Deploy production with updated environment
        run: npx --yes vercel@59.10.0 deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_SCOPE"
