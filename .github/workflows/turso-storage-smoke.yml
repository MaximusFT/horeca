name: Turso storage smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SILPO_OAUTH_ENCRYPTION_KEY: ${{ secrets.SILPO_OAUTH_ENCRYPTION_KEY }}
    steps:
      - name: Check required secrets
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing TURSO_DATABASE_URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing TURSO_AUTH_TOKEN"; exit 1; }
          test -n "$SILPO_OAUTH_ENCRYPTION_KEY" || { echo "Missing SILPO_OAUTH_ENCRYPTION_KEY"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run remote encrypted-storage smoke test
        run: npx vitest run tests/infrastructure/turso-remote-smoke.test.ts --reporter=verbose
